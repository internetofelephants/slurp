<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tupāra sounds</title>
  <style>
    :root {
      --bg: #1a1714; --card: #26211d; --ink: #efe6da; --dim: #b3a797; --line: #3a332c;
      --pick: #8f3b36; /* the tongue's red */
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
    h1 { font: 600 28px ui-rounded, system-ui, sans-serif; margin: 0 0 4px; }
    .lede { color: var(--dim); margin: 0 0 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 22px; }
    .bar label { color: var(--dim); display: flex; align-items: center; gap: 8px; }
    input[type=range] { width: 160px; accent-color: var(--ink); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .card h2 { font: 600 17px ui-rounded, system-ui, sans-serif; margin: 0; }
    .card p { color: var(--dim); margin: 2px 0 12px; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: 500 14px system-ui, sans-serif; color: var(--ink); background: #342d27; border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    button:hover { background: #3f372f; }
    button.demo { background: transparent; border-style: dashed; }
    .variant { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .variant button { border: 0; border-radius: 0; }
    .variant .star { padding: 8px 10px; color: var(--dim); background: #2d2722; }
    .variant.picked { border-color: var(--pick); }
    .variant.picked .star { color: var(--ink); background: var(--pick); }
    .picks { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 16px; color: var(--dim); }
    .picks b { color: var(--ink); }
  </style>
</head>
<body>
<main>
  <h1>Tupāra sounds</h1>
  <p class="lede">Every sound is made in code (Web Audio), with no files. Try the variants and ★ the one you
    like for each. Your picks are listed at the bottom, so you can just tell me the letters.</p>
  <div class="bar">
    <label>volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
    <button id="all">play every favourite</button>
  </div>
  <div id="cards"></div>
  <p class="picks" id="picks"></p>
</main>

<script>
// ---------- the sound kit (this is what goes into main.js) ----------
// makeSfx(ac, out) returns the sounds as functions of a start time t (seconds on ac's clock).
// Nothing is loaded: every sound is built from oscillators and filtered noise.
function makeSfx(ac, out) {
  const rnd = (a, b) => a + (b - a) * Math.random();
  const noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  // a gain envelope: silent → peak over `a` seconds → fades over `d` seconds
  function env(t, a, d, peak, dest = out) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    g.connect(dest);
    return g;
  }
  // an oscillator gliding f0 → f1 over its life
  function tone(t, type, f0, f1, a, d, peak, dest = out) {
    const o = ac.createOscillator(), g = env(t, a, d, peak, dest);
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + a + d);
    o.connect(g); o.start(t); o.stop(t + a + d + 0.05);
    return o;
  }
  // a burst of filtered noise; the filter can sweep f0 → f1
  function noise(t, type, f0, f1, q, a, d, peak, dest = out) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = env(t, a, d, peak, dest);
    s.buffer = noiseBuf;
    s.loopStart = 0; s.loop = true;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + a + d);
    s.connect(f); f.connect(g);
    s.start(t, rnd(0, 0.9)); s.stop(t + a + d + 0.05);
  }
  // a crackle: many tiny noise grains spread over `span` seconds
  function grains(t, n, span, type, lo, hi, q, peak, len = [0.008, 0.03]) {
    for (let i = 0; i < n; i++) {
      const at = t + span * Math.pow(Math.random(), 1.3);
      noise(at, type, rnd(lo, hi), rnd(lo, hi), q, 0.002, rnd(...len), peak * rnd(0.4, 1));
    }
  }
  // a soft bell: a sine and two inharmonic partials
  function bell(t, f, peak, d = 1.4) {
    tone(t, 'sine', f, f, 0.004, d, peak);
    tone(t, 'sine', f * 2.76, f * 2.76, 0.004, d * 0.45, peak * 0.28);
    tone(t, 'sine', f * 5.4, f * 5.4, 0.004, d * 0.2, peak * 0.1);
  }
  // a low-passed bus, for sounds that should feel muffled and warm
  function warm(freq) {
    const f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq; f.connect(out);
    return f;
  }

  return {
    eat: {
      A: (t) => tone(t, 'sine', rnd(1100, 1500), rnd(850, 1000), 0.004, 0.05, 0.07),               // soft blip
      B: (t) => { noise(t, 'bandpass', 3400, 3000, 5, 0.001, 0.02, 0.22); tone(t, 'sine', 2300, 2100, 0.002, 0.02, 0.02); }, // tick
      C: (t) => tone(t, 'sine', rnd(620, 700), 260, 0.003, 0.06, 0.1, warm(1800)),                 // tiny pop
    },
    rip: {
      A: (t) => { noise(t, 'highpass', 2500, 2000, 0.7, 0.001, 0.03, 0.15); grains(t + 0.01, 7, 0.18, 'bandpass', 1600, 3600, 2, 0.16); },   // bark crack
      B: (t) => { noise(t, 'bandpass', 400, 1300, 1.2, 0.02, 0.22, 0.12); grains(t, 11, 0.28, 'lowpass', 500, 1100, 1, 0.3, [0.01, 0.04]); }, // earthy scrape (mound)
      C: (t) => { grains(t, 16, 0.2, 'highpass', 2400, 5200, 1, 0.12, [0.005, 0.02]); noise(t, 'highpass', 3000, 5000, 0.7, 0.01, 0.12, 0.05); }, // papery tear (carton)
    },
    sting: {
      A: (t) => tone(t, 'sawtooth', 430, 250, 0.003, 0.09, 0.09, warm(2600)),                      // zap
      B: (t) => {                                                                                  // buzzing nip
        const o = tone(t, 'square', 190, 170, 0.004, 0.13, 0.05, warm(2000));
        const lfo = ac.createOscillator(), depth = ac.createGain();
        lfo.frequency.value = 38; depth.gain.value = 35; lfo.connect(depth); depth.connect(o.frequency);
        lfo.start(t); lfo.stop(t + 0.2);
      },
      C: (t) => { tone(t, 'triangle', 950, 700, 0.002, 0.05, 0.12); tone(t + 0.06, 'triangle', 720, 520, 0.002, 0.07, 0.1); }, // double nip
      bullet: (t) => {                                                                             // a bullet ant: much worse
        tone(t, 'sawtooth', 340, 110, 0.004, 0.32, 0.16, warm(2200));
        noise(t, 'bandpass', 1800, 700, 1.5, 0.002, 0.18, 0.14);
      },
    },
    shelter: {
      A: (t) => { const w = warm(1100); [220, 277.2, 329.6, 415.3].forEach((f, i) => tone(t + i * 0.09, 'sine', f, f, 0.6, 2.6, 0.045, w)); }, // warm chord
      B: (t) => [659.3, 554.4, 440].forEach((f, i) => {                                               // a three-note lullaby
        tone(t + i * 0.38, 'sine', f, f, 0.02, 1.3, 0.06);
        tone(t + i * 0.38, 'sine', f * 2, f * 2, 0.02, 0.5, 0.012);
      }),
      C: (t) => { noise(t, 'lowpass', 1300, 280, 0.5, 0.7, 1.6, 0.09); tone(t + 0.15, 'sine', 110, 104, 0.8, 1.8, 0.05); }, // a settling sigh
    },
    snap: {
      A: (t) => {                                                                                  // crack, splinters, thud
        noise(t, 'highpass', 2200, 1500, 0.7, 0.001, 0.04, 0.3);
        grains(t + 0.02, 10, 0.25, 'bandpass', 1200, 3200, 2, 0.18);
        noise(t + 0.05, 'highpass', 3000, 5000, 0.5, 0.05, 0.4, 0.05);                              // leaves
        tone(t + 0.55, 'sine', 95, 42, 0.004, 0.38, 0.3);                                          // hits the ground
        grains(t + 0.56, 6, 0.12, 'lowpass', 300, 700, 1, 0.2);
      },
      B: (t) => {                                                                                  // a creak first
        const w = ac.createBiquadFilter(); w.type = 'bandpass'; w.frequency.value = 700; w.Q.value = 6; w.connect(out);
        tone(t, 'sawtooth', 150, 95, 0.05, 0.4, 0.09, w);
        noise(t + 0.45, 'highpass', 2200, 1500, 0.7, 0.001, 0.04, 0.3);
        grains(t + 0.47, 10, 0.25, 'bandpass', 1200, 3200, 2, 0.18);
        tone(t + 1.0, 'sine', 95, 42, 0.004, 0.38, 0.3);
        grains(t + 1.01, 6, 0.12, 'lowpass', 300, 700, 1, 0.2);
      },
      C: (t) => { noise(t, 'highpass', 1800, 1200, 0.7, 0.001, 0.06, 0.28); tone(t + 0.4, 'sine', 80, 40, 0.004, 0.3, 0.26); }, // short and simple
    },
    bees: {
      A: (t) => [1046.5, 1318.5, 1568, 2093].forEach((f, i) => bell(t + i * 0.08, f, 0.05)),       // a rising arpeggio
      B: (t) => { for (let i = 0; i < 6; i++) bell(t + i * 0.055, 1568 * (i % 2 ? 1.5 : 1), 0.045 * (1 - i * 0.13), 0.9); }, // shimmering chime
      C: (t) => [784, 1046.5, 1318.5, 1568].forEach((f, i) => tone(t + i * 0.09, 'triangle', f, f, 0.003, 0.28, 0.08)),    // marimba run
    },
  };
}

// ---------- ambient soundtrack ----------
// makeMusic(ac, out) returns three moods, each a function (t0, dur) that schedules a stretch of
// music starting at t0 and returns its bus (a gain node: ramp it down to stop early).
// Everything is generated: pads, plucks, a flute, wind and night creatures, in a soft room.
function makeMusic(ac, out) {
  const r = (a, b) => a + (b - a) * Math.random();
  const pickOne = (xs) => xs[Math.floor(Math.random() * xs.length)];
  const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
  const noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  // a bus for one piece, faded in and out, feeding the output dry and through a soft room
  function bus(t0, dur, wet = 0.55) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(1, t0 + 2.5);
    g.gain.setValueAtTime(1, t0 + dur - 3);
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    g.connect(out);
    const room = ac.createConvolver(), n = ac.sampleRate * 3.5, ir = ac.createBuffer(2, n, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3; }
    room.buffer = ir;
    const wetG = ac.createGain(); wetG.gain.value = wet;
    room.connect(wetG); wetG.connect(g);
    const send = ac.createGain();   // what the instruments feed: dry + room
    send.connect(g); send.connect(room);
    return { g, send };
  }
  function panTo(dest, p) { const s = ac.createStereoPanner(); s.pan.value = p; s.connect(dest); return s; }
  function filter(dest, type, f, q = 0.7) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b; }
  function lfo(param, rate, depth, t0, dur) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = rate; g.gain.value = depth; o.connect(g); g.connect(param);
    o.start(t0); o.stop(t0 + dur + 0.5);
  }
  // one note: attack a, hold, release rel
  function note(t, type, f, a, hold, rel, peak, dest, detune = 0) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + a + hold + rel + 0.1);
    return o;
  }
  function noiseFor(t, dur, dest, peak) {
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true;
    g.gain.value = peak; s.connect(g); g.connect(dest);
    s.start(t, r(0, 1.5)); s.stop(t + dur);
    return g;
  }
  // a soft pluck, kalimba-ish
  function pluck(t, m, peak, dest) {
    const f = mtof(m);
    note(t, 'sine', f, 0.004, 0, 1.6, peak, dest);
    note(t, 'sine', f * 3.01, 0.003, 0, 0.25, peak * 0.22, dest);
  }
  // night insects: a cricket's trill of three short pulses
  function cricket(t, dest) {
    for (let k = 0; k < 3; k++) note(t + k * 0.075, 'sine', r(4200, 4500), 0.006, 0.03, 0.03, 0.005, dest);
  }
  // a tree frog's dry tik-tik
  function frog(t, dest) {
    const bp = filter(dest, 'bandpass', r(1900, 2500), 10);
    for (let k = 0; k < randInt(2, 4); k++) noiseFor(t + k * 0.07, 0.025, bp, 0.18);
  }
  const randInt = (a, b) => Math.floor(r(a, b + 1));

  return {
    // A · Canopy at dusk: a breathing pad (Dsus2, then a wondering Bb with a raised 4th), sparse
    // plucks from D major pentatonic with the odd G# for a hint of the unknown, faint crickets
    A(t0, dur) {
      const { g, send } = bus(t0, dur);
      const lp = filter(send, 'lowpass', 650, 0.4);
      lfo(lp.frequency, 0.07, 260, t0, dur);
      const chords = [[50, 57, 64, 69], [46, 53, 60, 64]];
      chords.forEach((ch, i) => {
        const ct = t0 + (i * dur) / 2 - (i ? 1.5 : 0);
        for (const m of ch) for (const det of [-8, 8]) note(ct, 'sawtooth', mtof(m), 3, dur / 2 - 2.5, 3.5, 0.011, lp, det);
      });
      const scale = [62, 64, 66, 69, 71, 74, 76, 62, 69, 68];
      for (let t = t0 + 1.8; t < t0 + dur - 3; t += r(0.8, 2.1)) pluck(t, pickOne(scale), 0.05, panTo(send, r(-0.5, 0.5)));
      for (let t = t0 + 2.5; t < t0 + dur - 1.5; t += r(1.4, 3)) cricket(t, panTo(g, r(-0.8, 0.8)));
      return g;
    },
    // B · First steps: a slow, very soft heartbeat under a gentle marimba figure in A dorian that
    // lifts to D major halfway, over a quiet pad
    B(t0, dur) {
      const { g, send } = bus(t0, dur, 0.45);
      const pad = filter(send, 'lowpass', 900, 0.4);
      [[45, 52, 59, 64, 67], [42, 50, 57, 62, 66]].forEach((ch, i) => {
        const ct = t0 + (i * dur) / 2 - (i ? 1.5 : 0);
        for (const m of ch) note(ct, 'triangle', mtof(m), 2.5, dur / 2 - 2, 3, 0.012, pad);
      });
      const beat = filter(g, 'lowpass', 220);
      for (let t = t0 + 1; t < t0 + dur - 2; t += 1.25) {
        note(t, 'sine', 58, 0.01, 0, 0.28, 0.07, beat);
        note(t + 0.24, 'sine', 52, 0.01, 0, 0.22, 0.045, beat);
      }
      const figs = [[57, 60, 64, 62, 60, 64, 66, 64], [62, 66, 69, 66, 64, 69, 71, 69]];
      const mar = filter(send, 'lowpass', 2400);
      let i = 0;
      for (let t = t0 + 2; t < t0 + dur - 2.5; t += 0.5, i++) {
        if (Math.random() < 0.22) continue;
        const fig = figs[t - t0 < dur / 2 ? 0 : 1];
        note(t, 'triangle', mtof(fig[i % 8]), 0.004, 0, 0.45, 0.03, panTo(mar, Math.sin(i * 0.9) * 0.35));
      }
      return g;
    },
    // C · Night air: breathy wind and a low drone on E, a lone wooden flute (E dorian) whose
    // second phrase stops on the bright sixth without resolving, and distant tree frogs
    C(t0, dur) {
      const { g, send } = bus(t0, dur, 0.6);
      const wind = filter(g, 'bandpass', 600, 0.8);
      lfo(wind.frequency, 0.06, 320, t0, dur);
      const wg = noiseFor(t0, dur, wind, 0.026);
      lfo(wg.gain, 0.11, 0.013, t0, dur);
      note(t0, 'sine', mtof(40), 3, dur - 5, 2, 0.028, send);
      note(t0 + 1, 'triangle', mtof(47), 3, dur - 6, 2, 0.012, send);
      const flute = (t, phrase) => {
        const o = ac.createOscillator(), gg = ac.createGain(), total = phrase.reduce((s, [, d]) => s + d, 0);
        o.type = 'sine';
        let at = t;
        o.frequency.setValueAtTime(mtof(phrase[0][0]), t);
        for (const [m, d] of phrase) { o.frequency.setTargetAtTime(mtof(m), at, 0.04); at += d; }
        lfo(o.detune, 5, 9, t + 0.4, total);   // vibrato
        gg.gain.setValueAtTime(0.0001, t);
        gg.gain.linearRampToValueAtTime(0.05, t + 0.25);
        gg.gain.setValueAtTime(0.045, t + total - 0.2);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + total + 1.2);
        o.connect(gg); gg.connect(panTo(send, 0.15));
        o.start(t); o.stop(t + total + 1.4);
        noiseFor(t, 0.18, filter(send, 'bandpass', 1800, 2), 0.02);   // a breath as it starts
      };
      flute(t0 + 2.5, [[64, 0.9], [67, 0.6], [69, 1.6], [67, 0.9]]);
      flute(t0 + 8.2, [[71, 0.7], [69, 0.6], [67, 0.7], [73, 2.2]]);
      for (let t = t0 + 1.5; t < t0 + dur - 1.5; t += r(1.6, 3.5)) frog(t, panTo(g, r(-0.9, 0.9)));
      return g;
    },
    // D · First steps in the rainforest (the pick): C's rainforest (wind and tree frogs) with B's
    // heartbeat and pad over it (no marimba: its plinks would clash with the eating blips). Runs
    // for any length: every section (half the piece, up to 12 s) moves to the next chord,
    // A dorian → D → F lydian → E minor → back round; the heartbeat comes and goes (on for two
    // sections, off for two) so it never nags.
    D(t0, dur) {
      const { g, send } = bus(t0, dur, 0.5);
      // the rainforest
      const wind = filter(g, 'bandpass', 600, 0.8);
      lfo(wind.frequency, 0.06, 320, t0, dur);
      const wg = noiseFor(t0, dur, wind, 0.026);
      lfo(wg.gain, 0.11, 0.013, t0, dur);
      for (let t = t0 + 1.5; t < t0 + dur - 1.5; t += r(1.6, 3.5)) frog(t, panTo(g, r(-0.9, 0.9)));
      // first steps
      const SECTIONS = [
        { pad: [45, 52, 59, 64, 67] },   // A dorian
        { pad: [42, 50, 57, 62, 66] },   // D over F#: the lift
        { pad: [41, 48, 57, 64, 71] },   // F with a raised 4th: wonder
        { pad: [40, 47, 55, 62, 67] },   // E minor: a moment's doubt
      ];
      const len = Math.min(12, dur / 2), pad = filter(send, 'lowpass', 900, 0.4);
      const beat = filter(g, 'lowpass', 220);
      for (let k = 0; t0 + k * len < t0 + dur - 2; k++) {
        const S = SECTIONS[k % SECTIONS.length], st = t0 + k * len, end = Math.min(st + len, t0 + dur);
        for (const m of S.pad) note(st - (k ? 1.5 : 0), 'triangle', mtof(m), 2.5, Math.max(0.5, end - st - 2), 3, 0.016, pad);
        if (k % 4 < 2) {
          for (let t = st + (k ? 0 : 1); t < end - 0.3 && t < t0 + dur - 2; t += 1.25) {
            note(t, 'sine', 58, 0.01, 0, 0.28, 0.07, beat);
            note(t + 0.24, 'sine', 52, 0.01, 0, 0.22, 0.045, beat);
          }
        }
      }
      return g;
    },
  };
}

// ---------- the test page ----------
const SOUNDS = [
  { key: 'eat', name: '1 · an ant or termite eaten', when: 'Every lick that catches something. Plays a lot, so it must be tiny.',
    names: { A: 'A · soft blip', B: 'B · tick', C: 'C · tiny pop' },
    demos: [['eating ×8 (tongue speed)', (s, t) => { for (let i = 0; i < 8; i++) s.eat[pick('eat')](t + i * 0.34); }]] },
  { key: 'rip', name: '2 · ripping into a nest', when: 'Each claw strike that breaks into a nest.',
    names: { A: 'A · bark crack', B: 'B · earthy scrape', C: 'C · papery tear' },
    demos: [['all three, one per nest type', (s, t) => { s.rip.A(t); s.rip.B(t + 0.7); s.rip.C(t + 1.4); }]] },
  { key: 'sting', name: '3 · a bite or sting', when: 'Each sting you receive. A little harsher than eating.',
    names: { A: 'A · zap', B: 'B · buzzing nip', C: 'C · double nip' },
    demos: [['bullet ant (a much worse sting)', (s, t) => s.sting.bullet(t)], ['eat, eat, eat, stung', (s, t) => { for (let i = 0; i < 3; i++) s.eat[pick('eat')](t + i * 0.34); s.sting[pick('sting')](t + 1.02); }]] },
  { key: 'shelter', name: '4 · settling into a shelter', when: 'When you press Enter to sleep in a burrow, hollow or log.',
    names: { A: 'A · warm chord', B: 'B · lullaby', C: 'C · settling sigh' } },
  { key: 'snap', name: '5 · a branch breaking', when: 'A dead branch snaps and falls (and you drop with it).',
    names: { A: 'A · crack & thud', B: 'B · creak, crack, thud', C: 'C · short & simple' } },
  { key: 'bees', name: '6 · finding the stingless bees', when: 'The first time you break into a bee hive and find honey.',
    names: { A: 'A · rising arpeggio', B: 'B · shimmering chime', C: 'C · marimba run' } },
];
let ac = null, master = null, sfx = null, music = null, playing = null;
function audio() {
  if (!ac) {
    ac = new AudioContext();
    master = ac.createGain();
    const comp = ac.createDynamicsCompressor();   // a safety net against sudden loud peaks
    master.connect(comp); comp.connect(ac.destination);
    sfx = makeSfx(ac, master);
    music = makeMusic(ac, master);
  }
  master.gain.value = +document.getElementById('vol').value;
  if (ac.state === 'suspended') ac.resume();
  return ac.currentTime + 0.03;
}
const picks = {};
try { Object.assign(picks, JSON.parse(localStorage.getItem('tupara-sfx-picks') || '{}')); } catch (e) {}
const pick = (k) => picks[k] || 'A';
function savePicks() {
  try { localStorage.setItem('tupara-sfx-picks', JSON.stringify(picks)); } catch (e) {}
  document.getElementById('picks').innerHTML = 'Your picks: ' +
    [...SOUNDS.map((s) => s.key), 'music'].map((k) => `<b>${k[0].toUpperCase() + k.slice(1)} ${picks[k] || '–'}</b>`).join(' · ') +
    ' <br>(★ marks your favourite in each row; unpicked rows default to A.)';
  for (const el of document.querySelectorAll('.variant')) el.classList.toggle('picked', picks[el.dataset.key] === el.dataset.v);
}
const cards = document.getElementById('cards');
for (const S of SOUNDS) {
  const c = document.createElement('section');
  c.className = 'card';
  c.innerHTML = `<h2>${S.name}</h2><p>${S.when}</p><div class="row"></div>`;
  const row = c.querySelector('.row');
  for (const v of ['A', 'B', 'C']) {
    const g = document.createElement('span');
    g.className = 'variant'; g.dataset.key = S.key; g.dataset.v = v;
    const play = document.createElement('button'), star = document.createElement('button');
    play.textContent = '▶ ' + S.names[v];
    play.onclick = () => { const t = audio(); sfx[S.key][v](t); };
    star.className = 'star'; star.textContent = '★'; star.title = 'pick this one';
    star.onclick = () => { picks[S.key] = v; savePicks(); };
    g.append(play, star);
    row.append(g);
  }
  for (const [label, fn] of S.demos || []) {
    const b = document.createElement('button');
    b.className = 'demo'; b.textContent = '▶ ' + label;
    b.onclick = () => { const t = audio(); fn(sfx, t); };
    row.append(b);
  }
  cards.append(c);
}
// the soundtrack samples: one plays at a time; effects can be played over it
{
  const MOODS = { A: 'A · Canopy at dusk', B: 'B · First steps', C: 'C · Night air', D: 'D · B over C’s rainforest, no marimba' };
  const c = document.createElement('section');
  c.className = 'card';
  c.innerHTML = `<h2>7 · ambient soundtrack (15 s samples)</h2><p>Quiet and moody, a new adventure with a hint
    of apprehension. While one plays, try the effects above over it. The one you pick gets expanded
    into a full looping soundtrack.</p><div class="row"></div>`;
  const row = c.querySelector('.row');
  const stop = () => {
    if (!playing) return;
    const g = playing.gain;
    g.cancelScheduledValues(ac.currentTime);
    g.setValueAtTime(g.value, ac.currentTime);
    g.linearRampToValueAtTime(0.0001, ac.currentTime + 0.4);
    playing = null;
  };
  for (const v of ['A', 'B', 'C', 'D']) {
    const g = document.createElement('span');
    g.className = 'variant'; g.dataset.key = 'music'; g.dataset.v = v;
    const play = document.createElement('button'), star = document.createElement('button');
    play.textContent = '▶ ' + MOODS[v];
    play.onclick = () => { const t = audio(); stop(); playing = music[v](t, 15); };
    star.className = 'star'; star.textContent = '★'; star.title = 'pick this one';
    star.onclick = () => { picks.music = v; savePicks(); };
    g.append(play, star);
    row.append(g);
  }
  const lb = document.createElement('button');
  lb.className = 'demo'; lb.textContent = '▶ D · 2-minute preview (how it develops)';
  lb.onclick = () => { const t = audio(); stop(); playing = music.D(t, 120); };
  row.append(lb);
  const sb = document.createElement('button');
  sb.className = 'demo'; sb.textContent = '■ stop';
  sb.onclick = stop;
  row.append(sb);
  cards.append(c);
}
document.getElementById('vol').oninput =() => { if (master) master.gain.value = +document.getElementById('vol').value; };
document.getElementById('all').onclick = () => {
  const t = audio(), gaps = { eat: 0.6, rip: 0.9, sting: 0.9, shelter: 3.2, snap: 1.8, bees: 1.6 };
  let at = t;
  for (const S of SOUNDS) { sfx[S.key][pick(S.key)](at); at += gaps[S.key]; }
};
savePicks();
</script>
